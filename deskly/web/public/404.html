<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found · Deskly</title>
    <!-- guuey#1146: the hosting layer's 404 for file-like unknown paths (/x.txt), served with
         status 404 + text/html — never an empty body the browser might offer as a download. -->
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f4ee; color: #1b1712; }
      main { max-width: 960px; margin: 0 auto; padding: 96px 24px; display: grid; gap: 14px; justify-items: start; }
      .code { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6b625a; margin: 0; }
      h1 { margin: 0; font-size: 34px; font-weight: 500; line-height: 1.15; }
      p { margin: 0; color: #6b625a; }
      a { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 999px; background: #1b1712; color: #fff; text-decoration: none; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>There&rsquo;s nothing at this address.</h1>
      <p>The link may be old, or the address mistyped.</p>
      <a href="/">Back to Deskly</a>
    </main>
  </body>
</html>
